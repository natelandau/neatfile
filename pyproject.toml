[project]
    authors = [{ name = "Nate Landau", email = "neatfile@natenate.org" }]
    classifiers = [
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
    ]
    dependencies = [
        "cappa>=0.33.0",
        "datefind>=1.0.1,<2",
        "exifread>=3.5.1,<4",
        "huggingface-hub>=1.33.0,<3",
        "model2vec>=0.10.0,<1",
        "nclutils>=4.0.0,<5",
        "numpy>=2.5.5,<3",
        "pypdf>=7.1.1,<8",
        "questionary>=2.1.1,<3",
        "rich>=15.0.0",
        "simplemma>=2.0.0,<3",
        "tzlocal>=5.4.5,<6",
    ]
    description = "CLI to automatically normalize and organize your files based on customizable rules."
    license = "AGPL-3.0-only"
    name = "neatfile"
    readme = "README.md"
    requires-python = ">=3.12"
    version = "6.0.0"

    [project.urls]
        Homepage   = "https://github.com/natelandau/neatfile"
        Repository = "https://github.com/natelandau/neatfile"

    [project.scripts]
        neatfile = "neatfile.cli:main"

[dependency-groups]
    dev = [
        "commitizen>=4.20.0",
        "duty>=1.10.1",
        "gate-cache>=0.12.0",
        "prek>=0.5.11",
        "pytest-cov>=7.1.0",
        "pytest-devtools>=1.3.0",
        "pytest-mock>=3.17.0",
        "pytest-randomly>=5.1.0",
        "pytest-sugar>=1.1.1",
        "pytest>=9.2.0",
        "ruff>=0.17.6",
        "ty>=0.0.108",
        "typos>=1.52.2",
]

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.13.9,<0.14.0"]

[tool.commitizen]
    bump_message               = "bump(release): v$current_version → v$new_version"
    changelog_merge_prerelease = true
    tag_format                 = "v$version"
    update_changelog_on_bump   = true
    version_files              = ["src/neatfile/constants.py:VERSION"]
    version_provider           = "uv"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
    exclude_also = [
        'assert_never',
        'def __repr__',
        'if TYPE_CHECKING:',
        'if __name__ == .__main__.:',
        'if typing.TYPE_CHECKING:',
    ]
    fail_under   = 90
    precision    = 1
    show_missing = true
    skip_covered = true
    skip_empty   = true

[tool.coverage.run]
    branch    = true
    data_file = ".cache/.coverage"
    source    = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.pytest] # https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref
    addopts               = ["--color=yes", "--doctest-modules", "--exitfirst", "--failed-first"]
    cache_dir             = ".cache/pytest"
    capsys_strip_tmp_path = true
    doctest_optionflags   = ["IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
    filterwarnings        = ["error"]
    minversion            = "9.0"
    required_plugins      = ["pytest-cov", "pytest-devtools", "pytest-mock", "pytest-randomly"]
    set_columns           = true
    strict                = true
    testpaths             = ["src", "tests"]

[tool.ty] # https://docs.astral.sh/ty/reference/configuration/
    [tool.ty.src]
        include = ["src", "tests"]

[tool.ruff] # https://github.com/charliermarsh/ruff
    fix           = true
    line-length   = 100
    output-format = "grouped"
    src           = ["src", "tests"]

    [tool.ruff.lint]
        ignore = [
            "ANN204",  # Missing return type annotation for special method `__init__`
            "COM812",  # Trailing comma missing"
            "CPY001",  # Missing copyright notice at top of file
            "D107",    # undocumented-public-init
            "E501",    # line-too-long
            "FIX002",  # Line contains TODO, consider resolving the issue
            "PLR0913", # too-many-arguments
            "RSE102",  # Unnecessary parentheses on raised exception
            "S311",    # suspicious-non-cryptographic-random-usage
            "TD002",   # Missing author in TODO
            "TD003",   # Missing issue link on the line following this TODO
        ]
        per-file-ignores = { "tests/*.py" = [
            "A002",
            "A003",
            "ANN001",
            "ANN201",
            "ARG001",
            "ARG002",
            "ARG005",
            "D102",
            "DOC501",  # Raised exception missing from docstring
            "ERA001",
            "F403",
            "FBT001",
            "FBT002",
            "PGH003",
            "PLC2701", # import-private-name
            "PLR0917",
            "PLR2004",
            "PLR6301",
            "S101",
            "SLF001",  # Private member accessed
        ], "duties.py" = ["ANN001"] }
        select = ["ALL"]
        unfixable = [
            "ERA001", # Commented out code
            "F401",   # unused-import
            "F841",   # unused-variable
        ]
        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-positional-args = 6
