---
name: "Create Release"

on:
    # Dispatch against the tag ref itself, not a branch: the tests below are a local
    # reusable workflow, so they always run at this workflow's ref. Releasing a tag
    # while testing a branch would publish code that was never tested.
    workflow_dispatch:
    push:
        tags:
            - "v*"

# A cancelled run can leave a GitHub release behind with no matching PyPI upload.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    run-tests:
        uses: ./.github/workflows/reusable-tests.yml

    autorelease:
        name: Create Release
        runs-on: ubuntu-latest
        needs: run-tests
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Python, uv, and the package
              uses: ./.github/actions/setup_python_env

            - name: Check that the tag matches the project version
              run: |
                  if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                      echo "::error::This workflow must run against a tag, not '$GITHUB_REF_NAME'"
                      exit 1
                  fi
                  PROJECT_VERSION=$(uv version --short)
                  if [[ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION"
                      exit 1
                  fi
                  echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

            - name: Build the package
              run: uv build

            - name: Generate release notes from the changelog
              run: uv run cz changelog --dry-run "$PROJECT_VERSION" > release-notes.md

            # The publish job uploads exactly these files rather than rebuilding.
            - name: Upload the built package
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  if-no-files-found: error

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  body_path: release-notes.md
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-to-pypi:
        runs-on: ubuntu-latest
        needs: autorelease
        environment: pypi
        # id-token lets PyPI verify the run through OIDC in place of a stored password.
        permissions:
            id-token: write
        steps:
            - name: Download the built package
              uses: actions/download-artifact@v6
              with:
                  name: dist
                  path: dist/

            - name: Setup uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Upload to PyPI
              run: uv publish --trusted-publishing always dist/*
